<!DOCTYPE html>
<html>
  <head>
    <title>2D fluid simulations made easy</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #242321;
        color: white;
        font-family: Arial, sans-serif;
      }

      .layout {
        display: flex;
        align-items: flex-start;
        gap: 24px;
      }

      canvas {
        display: block;
        border: solid 2px black;
        background-color: #343330;
      }

      .panel {
        width: 300px;
        padding: 16px;
        background: #444340;
      }

      .panel h2 {
        margin-top: 0;
      }

      .panel label {
        display: grid;
        gap: 5px;
        margin: 14px 0;
      }

      .panel input,
      .panel select {
        width: 100%;
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body>
    <div class="layout">
      <canvas id="canvas" width="1200" height="900" background-color: lightgray></canvas>

      <aside class = "panel">
        <h2>Controls</h2>

        <label>
          Pas temporal
          <input id="delta-time" type="range"
                min="0.001" max="0.1" step="0.001">
          <output id="delta-time-value"></output>
        </label>

        <label>
          Nombre de partícules
          <input id="number-particles" type="range" min="100" max="3000" step="100">
          <output id="number-particles-value"></output>
        </label>

        <button id="reset-simulation" type="button">
          Reinicia la simulació
        </button>

        <label>
          Partícules de paret
          <input id="boundary-particles" type="checkbox">
          <output id="boundary-particles-value"></output>
        </label>

        <label>
          Gravetat
          <input id="gravity" type="checkbox">
          <output id="gravity-check"></output>
        </label>

        <label>
          Viscositat
          <input id="viscosity" type="range" min="0" max="2" step="0.1">
          <output id="viscosity-value"></output>
        </label>

        <label>
          Densitat de repòs
          <input id="rest-density" type="range" min="0.0" max="0.03" step="0.0001">
          <output id="rest-density-value"></output>
        </label>

        <label>
          Força de pressió
          <input id="stiffness" type="range" min="0" max="10" step="0.1">
          <output id="stiffness-value"></output>
          
          Funció de càlcul de pressió
          <select id="pressure-function">
            <option value="Tait">Tait</option>
            <option value="Linear">Linear</option>
          </select>
        </label>

        <label>
          Tensió superficial
          <input id="surface-tension" type="range" min="0" max="2" step="0.1">
          <output id="surface-tension-value"></output>
        </label>

        <label>
          Rebot amb la paret
          <input id="rebound" type="range" min="0.01" max="1" step="0.01">
          <output id="rebound-value"></output>
        </label>
    
      </aside>

      <aside class="panel">

        <h2>Mesures</h2>
        
        <p>Energia: <output id="energy">0</output> J</p>
        <p>Partícules: <output id="particles">0</output></p>
        <p>Densitat de repòs orientativa: <output id="avg-density">0</output></p>

        <h2>Color de les partícules</h2>

        <select id="color-mode">
          <option value="velocity">Velocitat</option>
          <option value="density">Densitat</option>
          <option value="pressureForce">Força de pressió</option>
          <option value="viscosity">Canvi de velocitat per XSPH</option>
          <option value="surface">Superfície</option>
        </select>
      </aside>

    </div>

    <script src="Kernel.js"></script>
    <script src="Vector2.js"></script>
    <script src="DrawUtils.js"></script>
    <script src="FluidHashGrid.js"></script>
    <script src="SPH/SPHParticle.js"></script>
    <script src="SPH/SPHSimulation.js"></script>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const energyDisplay = document.getElementById("energy");
      const particlesDisplay = document.getElementById("particles");
      const numberParticlesInput = document.getElementById("number-particles");
      const numberParticlesOutput = document.getElementById("number-particles-value");
      const avgDensity = document.getElementById("avg-density");
      const colorModeSelect = document.getElementById("color-mode");
      const pressureFunction = document.getElementById("pressure-function");
      
      const gravityInput = document.getElementById("gravity");
      const gravityOutput = document.getElementById("gravity-check");
      
      const sphSimulation = new SPHSimulation(canvas, ctx); //Inici de la simulació

      function updateGravityControl() {
        sphSimulation.GRAVITY_ENABLED = gravityInput.checked;
        gravityOutput.textContent = gravityInput.checked ? "Activada" : "Desactivada";
      }

      gravityInput.checked = sphSimulation.GRAVITY_ENABLED;
      gravityInput.addEventListener("change", updateGravityControl);
      updateGravityControl();

      const boundaryParticlesInput = document.getElementById("boundary-particles");
      const boundaryParticlesOutput = document.getElementById("boundary-particles-value");

      const resetButton = document.getElementById("reset-simulation");

      function updateBoundaryParticlesControl() {
        sphSimulation.useBoundaryParticles = boundaryParticlesInput.checked;

        boundaryParticlesOutput.textContent = boundaryParticlesInput.checked ? "Activades en reiniciar" : "Desactivades en reiniciar"
      };

      boundaryParticlesInput.checked = sphSimulation.useBoundaryParticles;
      boundaryParticlesInput.addEventListener("change", updateBoundaryParticlesControl);

      resetButton.addEventListener("click", () => {sphSimulation.reset();});

      updateBoundaryParticlesControl();

      function bindRange(inputId, outputId, property) {
        const input = document.getElementById(inputId);
        const output = document.getElementById(outputId);

        function applyValue() {
          const value = Number(input.value);
          sphSimulation[property] = value;
          output.textContent = value;
        }

        input.value = sphSimulation[property];
        input.addEventListener("input", applyValue);
        applyValue();
      }

      bindRange("number-particles", "number-particles-value", "AMOUNT_PARTICLES");
      bindRange("delta-time", "delta-time-value", "DELTA_TIME");
      bindRange("viscosity", "viscosity-value", "XSPH_EPSILON");
      bindRange("rest-density", "rest-density-value", "REST_DENSITY");
      bindRange("stiffness", "stiffness-value", "K_STIFFNESS");
      bindRange("surface-tension", "surface-tension-value", "SURFACE_TENSION_COEFFICIENT");
      bindRange("rebound", "rebound-value", "REBOUND_COEFF");

      colorModeSelect.addEventListener("change", () => {
        sphSimulation.colorMode = colorModeSelect.value;
      });
      
      pressureFunction.addEventListener("change", () => {
        sphSimulation.pressureFunction = pressureFunction.value;
      });

      numberParticlesInput.addEventListener("change", () => {
        const amount = Number(numberParticlesInput.value);
        sphSimulation.AMOUNT_PARTICLES = amount;
        numberParticlesOutput.textContent = amount;
      });

      function clearCanvas() {
        ctx.fillStyle = "#242321";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function updateSimulation() {
        sphSimulation.update();
      }

      function drawSimulation(){
        clearCanvas();
        sphSimulation.draw();
        particlesDisplay.textContent = Number(numberParticlesInput);
        avgDensity.textContent = (Number(particlesDisplay.textContent) * 1 / (canvas.height * canvas.width)).toFixed(4);
        energyDisplay.textContent = (sphSimulation.getTotalKineticEnergy()/10000).toFixed(2);
      }

      let framesToDraw = 0;

      function mainLoop() {
        requestAnimationFrame(mainLoop);
        updateSimulation();
        if(framesToDraw >= 0.1/sphSimulation.DELTA_TIME){
          sphSimulation.updateParticleColors();
          drawSimulation();
          framesToDraw = 0;
        }
        framesToDraw += 1;
      }

      mainLoop();
    </script>
  </body>
</html>
