<!DOCTYPE html>
<html>
  <head>
    <title>2D fluid simulations made easy:
      A practical guide for developers.
    </title>
    <style>
      * {padding: 0; margin: 40;}
      canvas {display: matrix; margin: 20px auto;}
      body {background: #242321}
    </style>
  </head>
  
  <body>
    <canvas id="canvas" width="900px" height="600px" style="border: solid 2px black"></canvas>
    <script src="Kernel.js"></script>
    <script src="Vector2.js"></script>
    <script src="DrawUtils.js"></script>
    <script src="FluidHashGrid.js"></script>
    <script src="SPH/SPHParticle.js"></script>
    <script src="SPH/SPHSimulation.js"></script>

    <script>
      var canvas = document.getElementById("canvas");
      var ctx = canvas.getContext("2d");

      let sphSimulation = new SPHSimulation(canvas, ctx, viscositat = 0.2);
      //let sphSimulation = new PCISPHSimulation();
      //let sphSimulation = new IISPHSimulation();
      //let sphSimulation = new DFSPHSimulation();
      //let sphSimulation = new PBFSimulation();
      sphSimulation.update();
      sphSimulation.draw();

      mainLoop();

      function updateSimulation(){
        Clear();
        sphSimulation.update();
        sphSimulation.draw();
      }

      function mainLoop(){
        window.requestAnimationFrame(mainLoop);
        updateSimulation();
      }

      function Clear(){
        ctx.fillStyle = "#242321";
        ctx.fillRect(0,0,canvas.width, canvas.height);
      }
    </script>
  </body>
</html>
